general {
  # This prevents hypridle from locking when the monitor turns back on
  ignore_dbus_inhibit = false
}

listener {
  timeout = 600 # run `systemctl --user restart hypridle.service` to apply
  condition_cmd = ! pgrep -f "[W]owClassic.exe|qemu-system-[x]86_64|[W]oW.exe" > /dev/null
  condition_retry = 30
  on-timeout = systemctl suspend # Or systemctl suspend-then-hibernate
}
