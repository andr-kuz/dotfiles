# ctrl + shift + F5 to update
cursor_shape block
cursor_trail 1
cursor_trail_start_threshold 0
cursor_trail_decay 0.05 0.1
shell_integration no-cursor
font_size 9.0
# background_opacity 0.7
include ./theme.conf
allow_remote_control yes
enable_audio_bell no

# ctrl+shift+f6 inside Kitty to check it's font settings
# `kitty +list-fonts --psnames` to get available font names
font_family      Liberation Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0

map ctrl+equal change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

map ctrl+shift+space launch --stdin-source=@screen_scrollback --type=overlay --env DISPLAY=:0 vim -R -c "set nowrap nonumber norelativenumber signcolumn=no clipboard=unnamedplus" -c "nnoremap q :qa!<CR>" -
